[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-dataset-quality-inspector"
version = "1.0.0"
description = "AI-powered dataset quality inspection system for detecting missing values, bias, drift, and fairness issues."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "seaborn",
    "matplotlib",
    "python-multipart",
    "openml",
]

[project.optional-dependencies]
dev = ["notebook"]
